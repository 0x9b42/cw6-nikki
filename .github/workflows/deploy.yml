name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Eleventy
        # Jika repo ini adalah repo user/org page (nama "<user>.github.io"),
        # situs di-serve dari root domain -> PATH_PREFIX kosong ("/").
        # Jika ini repo project page biasa, situs di-serve dari
        # "<user>.github.io/<nama-repo>/" -> PATH_PREFIX diisi nama repo.
        env:
          PATH_PREFIX: >-
            ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner)
              && '/' || format('/{0}/', github.event.repository.name) }}
        run: npx @11ty/eleventy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
